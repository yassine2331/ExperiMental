[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emaml"
version = "0.1.0"
description = "On-device ML/DL for EMA prediction from phone and wearable data, with counterfactual explanations"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]
export = ["onnx", "coremltools", "ai-edge-torch"]
explain = ["dice-ml", "shap"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
